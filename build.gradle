plugins { id 'java' }

group = 'com.adminsec'
version = '1.1.0'

repositories { mavenCentral() }

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.4'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking { lockAllConfigurations() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xlint:all'])
}

test { useJUnitPlatform() }

jar {
    archiveBaseName = 'csrf-review-assistant'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest { attributes('Main-Class': 'com.adminsec.csrf.CsrfReviewAssistantExtension') }
}
